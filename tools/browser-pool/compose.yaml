x-environment: &environment
  WORKOS_DATABASE_URL: ${WORKOS_BROWSERPOOL_GATE_DATABASE_URL:?}
  WORKOS_OWNER_ID: 01999999-9999-7999-8999-000000000b01
  WORKOS_DEVICE_ID: 01999999-9999-7999-8999-000000000b02
  WORKOS_DEV_AUTH_BYPASS: "true"
  WORKOS_CORE_URL: http://127.0.0.1:${WORKOS_BROWSERPOOL_GATE_CORE_PORT:?}
  WORKOS_HARNESS_URL: http://127.0.0.1:1
  WORKOS_RUNTIME_URL: http://127.0.0.1:${WORKOS_BROWSERPOOL_GATE_RUNTIME_PORT:?}
  WORKOS_RELIABILITY_URL: http://127.0.0.1:1
  WORKOS_INDEXER_URL: http://127.0.0.1:1
x-service: &service
  image: workos:dev
  user: ${WORKOS_BROWSERPOOL_GATE_USER:?}
  network_mode: host
  restart: "no"
  depends_on:
    bootstrap:
      condition: service_completed_successfully
services:
  bootstrap:
    image: workos:dev
    user: ${WORKOS_BROWSERPOOL_GATE_USER:?}
    network_mode: host
    environment: *environment
    command:
      - /bin/sh
      - -c
      - workosctl bootstrap && workos-dev-fixture -core-dir /fixture/core-execution -harness-dir /fixture/harness-execution -vault-dir /fixture/vault
    volumes:
      - ${WORKOS_BROWSERPOOL_GATE_DIR:?}/core-execution:/fixture/core-execution
      - ${WORKOS_BROWSERPOOL_GATE_DIR:?}/harness-execution:/fixture/harness-execution
      - ${WORKOS_BROWSERPOOL_GATE_DIR:?}/vault:/fixture/vault
  core:
    <<: *service
    command: [workos-core]
    environment:
      <<: *environment
      WORKOS_HTTP_ADDRESS: 127.0.0.1:${WORKOS_BROWSERPOOL_GATE_CORE_PORT:?}
      WORKOS_CREDENTIAL_MASTER_KEY_FILE: /fixture/vault/vault-master.key
      WORKOS_CREDENTIAL_ADMIN_SOCKET: /run/workos/credential-admin.sock
      WORKOS_CORE_EXECUTION_ADDRESS: 127.0.0.1:${WORKOS_BROWSERPOOL_GATE_EXECUTION_PORT:?}
      WORKOS_CORE_EXECUTION_CA_FILE: /fixture/execution/ca.crt
      WORKOS_CORE_EXECUTION_CERT_FILE: /fixture/execution/core.crt
      WORKOS_CORE_EXECUTION_KEY_FILE: /fixture/execution/core.key
    volumes:
      - ${WORKOS_BROWSERPOOL_GATE_DIR:?}/run:/run/workos
      - ${WORKOS_BROWSERPOOL_GATE_DIR:?}/core-execution:/fixture/execution:ro
      - ${WORKOS_BROWSERPOOL_GATE_DIR:?}/vault:/fixture/vault:ro
  # The gate's runtime-host runs from the Playwright image so the Browser
  # Pool launches real Chromium workers.
  runtime:
    build:
      context: .
      dockerfile: runtime.Dockerfile
    image: workos-browserpool-runtime:dev
    user: ${WORKOS_BROWSERPOOL_GATE_USER:?}
    network_mode: host
    restart: "no"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: [runtime-host]
    environment:
      <<: *environment
      WORKOS_HTTP_ADDRESS: 127.0.0.1:${WORKOS_BROWSERPOOL_GATE_RUNTIME_PORT:?}
      WORKOS_RUNTIME_BROWSER_BINARY: /ms-playwright/chromium-1234/chrome-linux64/chrome
      WORKOS_RUNTIME_BROWSER_SCRATCH: /var/workos-browserpool
  # The deterministic web target the pool navigates to: two real pages with
  # distinct content served from the fixture.
  web-fixture:
    image: workos:dev
    user: ${WORKOS_BROWSERPOOL_GATE_USER:?}
    network_mode: host
    restart: "no"
    command: [/usr/local/bin/browser-worker-fixture]
    environment:
      WORKOS_HTTP_ADDRESS: 127.0.0.1:8080
  gateway:
    <<: *service
    command: [workos-gateway]
    environment:
      <<: *environment
      WORKOS_HTTP_ADDRESS: 127.0.0.1:${WORKOS_BROWSERPOOL_GATE_GATEWAY_PORT:?}
      WORKOS_STATIC_DIR: /srv/workos/desktop

x-environment: &environment
  WORKOS_DATABASE_URL: ${WORKOS_BUILDTEST_GATE_DATABASE_URL:?}
  WORKOS_OWNER_ID: 01999999-9999-7999-8999-000000000b01
  WORKOS_DEVICE_ID: 01999999-9999-7999-8999-000000000b02
  WORKOS_DEV_AUTH_BYPASS: "true"
  WORKOS_CORE_URL: http://127.0.0.1:${WORKOS_BUILDTEST_GATE_CORE_PORT:?}
  WORKOS_HARNESS_URL: http://127.0.0.1:${WORKOS_BUILDTEST_GATE_HARNESS_PORT:?}
  WORKOS_RUNTIME_URL: http://127.0.0.1:${WORKOS_BUILDTEST_GATE_RUNTIME_PORT:?}
  WORKOS_RELIABILITY_URL: http://127.0.0.1:${WORKOS_BUILDTEST_GATE_RELIABILITY_PORT:?}
  WORKOS_INDEXER_URL: http://127.0.0.1:1
x-service: &service
  image: workos:dev
  user: ${WORKOS_BUILDTEST_GATE_USER:?}
  network_mode: host
  restart: "no"
  depends_on:
    bootstrap:
      condition: service_completed_successfully
services:
  bootstrap:
    image: workos:dev
    user: ${WORKOS_BUILDTEST_GATE_USER:?}
    network_mode: host
    environment: *environment
    command:
      - /bin/sh
      - -c
      - workosctl bootstrap && workos-dev-fixture -core-dir /fixture/core-execution -harness-dir /fixture/harness-execution -vault-dir /fixture/vault
    volumes:
      - ${WORKOS_BUILDTEST_GATE_DIR:?}/core-execution:/fixture/core-execution
      - ${WORKOS_BUILDTEST_GATE_DIR:?}/harness-execution:/fixture/harness-execution
      - ${WORKOS_BUILDTEST_GATE_DIR:?}/vault:/fixture/vault
  core:
    <<: *service
    command: [workos-core]
    environment:
      <<: *environment
      WORKOS_HTTP_ADDRESS: 127.0.0.1:${WORKOS_BUILDTEST_GATE_CORE_PORT:?}
      WORKOS_CREDENTIAL_MASTER_KEY_FILE: /fixture/vault/vault-master.key
      WORKOS_CREDENTIAL_ADMIN_SOCKET: /run/workos/credential-admin.sock
      WORKOS_CORE_EXECUTION_ADDRESS: 127.0.0.1:${WORKOS_BUILDTEST_GATE_EXECUTION_PORT:?}
      WORKOS_CORE_EXECUTION_CA_FILE: /fixture/execution/ca.crt
      WORKOS_CORE_EXECUTION_CERT_FILE: /fixture/execution/core.crt
      WORKOS_CORE_EXECUTION_KEY_FILE: /fixture/execution/core.key
    volumes:
      - ${WORKOS_BUILDTEST_GATE_DIR:?}/run:/run/workos
      - ${WORKOS_BUILDTEST_GATE_DIR:?}/core-execution:/fixture/execution:ro
      - ${WORKOS_BUILDTEST_GATE_DIR:?}/vault:/fixture/vault:ro
  harness:
    <<: *service
    command: [harness-host]
    environment:
      <<: *environment
      WORKOS_HTTP_ADDRESS: 127.0.0.1:${WORKOS_BUILDTEST_GATE_HARNESS_PORT:?}
      WORKOS_CONFIG_FILE: /fixture/cli/config.yaml
      WORKOS_CORE_EXECUTION_URL: https://127.0.0.1:${WORKOS_BUILDTEST_GATE_EXECUTION_PORT:?}
      WORKOS_HARNESS_EXECUTION_CA_FILE: /fixture/execution/ca.crt
      WORKOS_HARNESS_EXECUTION_CERT_FILE: /fixture/execution/harness.crt
      WORKOS_HARNESS_EXECUTION_KEY_FILE: /fixture/execution/harness.key
    volumes:
      - ${WORKOS_BUILDTEST_GATE_DIR:?}/harness-execution:/fixture/execution:ro
      - ${WORKOS_BUILDTEST_GATE_DIR:?}/cli:/fixture/cli:ro
  # The gate's runtime-host runs from the toolchain image so the process
  # Build/Test engine executes the real go build/test commands; the workload
  # engine stays the bounded fake fixture (ADR-0016) for canary surfaces.
  runtime:
    build:
      context: .
      dockerfile: runtime.Dockerfile
    image: workos-buildtest-runtime:dev
    user: ${WORKOS_BUILDTEST_GATE_USER:?}
    network_mode: host
    restart: "no"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: [runtime-host]
    environment:
      <<: *environment
      WORKOS_HTTP_ADDRESS: 127.0.0.1:${WORKOS_BUILDTEST_GATE_RUNTIME_PORT:?}
      WORKOS_RUNTIME_WORKLOAD_ENGINE: fake-fixture
      WORKOS_RUNTIME_FIXTURE_SCENARIO_FILE: /run/workos/fake-engine/scenario.conf
      WORKOS_RUNTIME_BUILDTEST_SCRATCH: /var/workos-buildtest
      WORKOS_RUNTIME_BUILDTEST_INTERVAL: 1s
      WORKOS_RUNTIME_BUILDTEST_LEASE_TTL: 5s
      WORKOS_RUNTIME_BUILDTEST_TIMEOUT: 2m
      WORKOS_RUNTIME_BUILDTEST_PROCESS_LIMIT: "65534"
    volumes:
      - ${WORKOS_BUILDTEST_GATE_DIR:?}/run:/run/workos
      - ${WORKOS_BUILDTEST_GATE_DIR:?}/scenario.conf:/run/workos/fake-engine/scenario.conf
  reliability:
    <<: *service
    command: [reliability-host]
    environment:
      <<: *environment
      WORKOS_HTTP_ADDRESS: 127.0.0.1:${WORKOS_BUILDTEST_GATE_RELIABILITY_PORT:?}
      WORKOS_RELIABILITY_POLL_INTERVAL: 1s
      WORKOS_RELIABILITY_POLL_TIMEOUT: 800ms
  gateway:
    <<: *service
    command: [workos-gateway]
    environment:
      <<: *environment
      WORKOS_HTTP_ADDRESS: 127.0.0.1:${WORKOS_BUILDTEST_GATE_GATEWAY_PORT:?}
      WORKOS_STATIC_DIR: /srv/workos/desktop

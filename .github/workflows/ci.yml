name: foundation-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.7
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.55.1
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Static checks and unit tests
        run: make check-native
      - name: Generated source drift
        run: |
          make generate
          git diff --exit-code
      - name: Protobuf compatibility
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=origin/main'

  acceptance:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL and cross-process integration
        run: make test-integration
      - name: Browser acceptance
        run: make test-e2e
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop acceptance stack
        if: always()
        run: docker compose down --remove-orphans

syntax = "proto3";

package workos.workload.v1;

option go_package = "github.com/yangtao121/workos/gen/go/workos/workload/v1;workloadv1";

enum WorkloadKind {
  WORKLOAD_KIND_UNSPECIFIED = 0;
  WORKLOAD_KIND_APP = 1;
  WORKLOAD_KIND_BACKGROUND_SERVICE = 2;
  WORKLOAD_KIND_HARNESS = 3;
  WORKLOAD_KIND_AGENT_TASK = 4;
  WORKLOAD_KIND_REMOTE_BROWSER = 5;
  WORKLOAD_KIND_NATIVE_SURFACE = 6;
}

enum WorkloadState {
  WORKLOAD_STATE_UNSPECIFIED = 0;
  WORKLOAD_STATE_PENDING = 1;
  WORKLOAD_STATE_RUNNING = 2;
  WORKLOAD_STATE_STOPPED = 3;
  WORKLOAD_STATE_FAILED = 4;
}

message WorkloadIdentity {
  string workload_id = 1;
  WorkloadKind kind = 2;
  string project_id = 3;
  string app_id = 4;
  string harness_instance_id = 5;
  string version = 6;
  string runtime_id = 7;
  string cgroup_path = 8;
  string owner_user_id = 9;
  WorkloadState state = 10;
}

message InspectNodeRequest {}

message NodeCapabilities {
  bool cgroup_v2 = 1;
  bool rootless_podman = 2;
  bool container_runner = 3;
  bool native_runner = 4;
  string reason = 5;
}

message GetWorkloadRequest {
  string workload_id = 1;
}

message StartWorkloadRequest {
  WorkloadIdentity workload = 1;
}

message StopWorkloadRequest {
  string workload_id = 1;
  string reason = 2;
}

message InspectNodeResponse {
  NodeCapabilities capabilities = 1;
}

message GetWorkloadResponse {
  WorkloadIdentity workload = 1;
}

message StartWorkloadResponse {
  WorkloadIdentity workload = 1;
}

message StopWorkloadResponse {
  WorkloadIdentity workload = 1;
}

service WorkloadService {
  rpc InspectNode(InspectNodeRequest) returns (InspectNodeResponse) {}
  rpc GetWorkload(GetWorkloadRequest) returns (GetWorkloadResponse) {}
  rpc StartWorkload(StartWorkloadRequest) returns (StartWorkloadResponse) {}
  rpc StopWorkload(StopWorkloadRequest) returns (StopWorkloadResponse) {}
}

// ---------------------------------------------------------------------------
// Supervised Workload contract (private, runtime-host owned).
//
// This is the only safe launch/control surface for supervised workloads. It is
// NOT on the gateway allowlist: it is reached only by in-process callers and
// by reliability-host over the trusted private network. Every identity field
// is server-derived; clients can never submit runtime IDs, cgroup paths,
// engine names, or endpoints. The legacy WorkloadService above stays an
// unimplemented scaffold on purpose: its StartWorkload accepts a client-filled
// WorkloadIdentity and must never become a real "accept it as-is" launch path.
// ---------------------------------------------------------------------------

// SupervisedWorkloadState is the durable lifecycle state machine of one
// supervised workload. pending/starting cover the reserved DB facts before the
// engine side effect is confirmed; running is the verified steady state;
// stopping/stopped are the ordered shutdown facts; failed marks a startup or
// runtime failure that no automatic actor is currently retrying.
enum SupervisedWorkloadState {
  SUPERVISED_WORKLOAD_STATE_UNSPECIFIED = 0;
  SUPERVISED_WORKLOAD_STATE_PENDING = 1;
  SUPERVISED_WORKLOAD_STATE_STARTING = 2;
  SUPERVISED_WORKLOAD_STATE_RUNNING = 3;
  SUPERVISED_WORKLOAD_STATE_STOPPING = 4;
  SUPERVISED_WORKLOAD_STATE_STOPPED = 5;
  SUPERVISED_WORKLOAD_STATE_FAILED = 6;
}

// WorkloadObservation is one neutral, bounded read of a supervised workload.
// It carries stable identity plus numeric facts only: no cgroup path, no
// loopback endpoint, no container ID, no raw process error, no log or HTTP
// content. It is an input to the reliability policy engine, never an Incident
// verdict.
message WorkloadObservation {
  string workload_id = 1;
  int64 generation = 2;
  SupervisedWorkloadState state = 3;
  string owner_user_id = 4;
  string project_id = 5;
  string app_instance_id = 6;
  string app_id = 7;
  string manifest_digest = 8;
  // HealthVerdict values (fixed grammar, mirrored from the domain):
  // "unknown" | "ok" | "failing".
  string health_verdict = 9;
  // ExitCategory values (fixed grammar): "none" | "exited" | "oom" |
  // "pids" | "unknown".
  string exit_category = 10;
  int32 restart_count = 11;
  // Bounded numeric counters read from the real cgroup at observation time.
  // Zero is a valid observed counter. Missing or malformed counter evidence
  // fails the observation RPC; it is never represented as fabricated zeroes.
  uint64 cpu_usage_usec = 12;
  uint64 memory_current_bytes = 13;
  uint64 memory_peak_bytes = 14;
  uint64 memory_events_oom = 15;
  uint64 pids_current = 16;
  // Deprecated: pids.events has no "peak" event. Kept for wire
  // compatibility; new producers leave it zero and consumers use field 20.
  uint64 pids_events_peak = 17 [deprecated = true];
  // True when the workload has no open surface session referencing it.
  bool idle = 18;
  string observed_at = 19; // RFC 3339 UTC
  // Cumulative pids.events `max` counter. A generation-local increase means
  // the enforced pids.max limit rejected at least one task creation.
  uint64 pids_events_max = 20;
}

message ListObservationsRequest {}

message ListObservationsResponse {
  repeated WorkloadObservation observations = 1;
}

message RestartWorkloadRequest {
  string workload_id = 1;
  // action_key is the caller's durable idempotency key for exactly this
  // restart decision. Same key replays the same result across caller and
  // runtime restarts; a reused key with a different decision identity is a
  // stable conflict.
  string action_key = 2;
}

message RestartWorkloadResponse {
  int64 generation = 1;
}

message TerminateWorkloadRequest {
  string workload_id = 1;
  string action_key = 2;
  // StopReason values (fixed grammar): "policy" | "restart_limit" |
  // "uninstalled" | "idle" | "fail_safe".
  string reason = 3;
}

message TerminateWorkloadResponse {}

service SupervisedWorkloadService {
  // ListObservations returns the neutral observation snapshot of every
  // supervised workload known to this runtime host.
  rpc ListObservations(ListObservationsRequest) returns (ListObservationsResponse) {}
  // RestartWorkload deterministically recreates the workload's container with
  // the exact pinned image/argv/policy and a new generation. The runtime
  // enforces the persisted restart limit and returns a sanitized
  // ResourceExhausted once it is exhausted; the decision to stop afterwards
  // belongs to the caller.
  rpc RestartWorkload(RestartWorkloadRequest) returns (RestartWorkloadResponse) {}
  // StopWorkload deterministically stops and removes the workload's container
  // by its exact identity. Idempotent by action key.
  rpc TerminateWorkload(TerminateWorkloadRequest) returns (TerminateWorkloadResponse) {}
}

syntax = "proto3";

package workos.taskexecution.v1;

import "workos/app/v1/source.proto";
import "workos/taskexecution/v1/repair.proto";

option go_package = "github.com/yangtao121/workos/gen/go/workos/taskexecution/v1;taskexecutionv1";

// One bounded Build/Test job over an immutable repair candidate. Runtime is
// the authority for execution facts only; inputs stay Core-owned.
message BuildTestJob {
  string task_id = 1;
  string incident_id = 2;
  string owner_user_id = 3;
  string project_id = 4;
  string installation_id = 5;
  RepairBuildInput input = 6;
  // The candidate source files (ADR-0024 limits); the engine materializes
  // them into an isolated working tree before any command runs.
  repeated workos.app.v1.AppSourceFile candidate_files = 7;
}

// Digest binding for idempotency: the submit is bound to one exact input.
message BuildTestInputFacts {
  string source_bundle_id = 1;
  string source_digest = 2;
  string manifest_digest = 3;
  string base_image = 4;
}

message SubmitBuildTestRequest {
  BuildTestJob job = 1;
  BuildTestInputFacts input_facts = 2;
}

message SubmitBuildTestResponse {
  string job_id = 1;
  bool created = 2;
}

message GetBuildTestRequest {
  string task_id = 1;
}

// Engine capability facts as enforced for this verdict. Never asserted from
// configuration alone; the reduced process tier reports its own limits.
message BuildEngineFacts {
  string engine = 1;
  bool network_isolated = 2;
  bool image_pinned = 3;
  // Kernel/cgroup-enforced limits actually applied for this verdict, fixed
  // grammar. Process tier: cpu-seconds|address-space|file-size|processes|
  // open-files|wall-clock|output-bytes. Docker tier: memory-max|pids-max|
  // cpu-max|read-only-rootfs|no-new-privileges|cap-drop-all|network-none|
  // wall-clock|output-bytes.
  repeated string enforced_limits = 4;
}

message GetBuildTestResponse {
  string job_id = 1;
  string task_id = 2;
  // queued|running|succeeded|failed|cancelled
  string state = 3;
  // The fixed grammar of the last stage entered: submit|materialize|build|test|verify.
  string stage = 4;
  int32 build_exit_code = 5;
  int32 test_exit_code = 6;
  // Fixed grammar of the terminal reason on failure:
  // build-failed|test-failed|timeout|engine-failed|output-budget|output-failed|input-drift|cancelled|none
  string failure_reason = 7;
  BuildEngineFacts engine = 8;
  string source_digest = 9;
  int32 attempts = 10;
  // The frozen release bundle this verdict committed (ADR-0033). Present only
  // when state=succeeded AND a ready app-bundle.v1 artifact exists; a success
  // verdict without it means the engine tier cannot produce deployable output.
  BuildArtifactFacts artifact = 11;
}

// The authoritative, bounded metadata of one release bundle as Runtime owns
// it (ADR-0033). Never carries bundle bytes. Core re-reads these facts from
// Runtime before registering any version; a caller-supplied id/digest string
// is only a reconciliation hint, never proof.
message BuildArtifactFacts {
  string artifact_id = 1;
  // Content digest: sha256 over the complete app-bundle.v1 byte stream.
  string artifact_digest = 2;
  string format = 3;
  // build_job|operator_import. An imported bundle carries no proof that this
  // round's Build/Test passed; projections must show it as an import.
  string origin = 4;
  int64 size_bytes = 5;
  int32 file_count = 6;
  // Job provenance (empty for operator_import).
  string job_id = 7;
  string task_id = 8;
  string incident_id = 9;
  string owner_user_id = 10;
  string project_id = 11;
  string installation_id = 12;
  string source_bundle_id = 13;
  string source_digest = 14;
  string manifest_digest = 15;
  string base_image = 16;
  // The fixed recipe echo, so a verifier can compare the exact commands.
  repeated string build_command = 17;
  repeated string test_command = 18;
  string output_directory = 19;
  // preparing|ready|failed|unavailable. Only ready bundles may back a
  // version; unavailable means metadata exists but the bytes are gone.
  string state = 20;
  // Operator-import and build provenance app identity (empty when unset).
  string app_id = 21;
}

message GetBuildArtifactRequest {
  // Either the producing task (build provenance) or the artifact id.
  string task_id = 1;
  string artifact_id = 2;
}

message GetBuildArtifactResponse {
  BuildArtifactFacts artifact = 1;
}

message CancelBuildTestRequest {
  string task_id = 1;
}

message CancelBuildTestResponse {
  string state = 1;
}

// Runtime's private Reliability/Core-facing listener only; Gateway never
// routes it. GetBuildArtifact lets Core independently verify job + ready
// bundle identity before registering any version (ADR-0033 section 4).
service BuildTestService {
  rpc SubmitBuildTest(SubmitBuildTestRequest) returns (SubmitBuildTestResponse) {}
  rpc GetBuildTest(GetBuildTestRequest) returns (GetBuildTestResponse) {}
  rpc CancelBuildTest(CancelBuildTestRequest) returns (CancelBuildTestResponse) {}
  rpc GetBuildArtifact(GetBuildArtifactRequest) returns (GetBuildArtifactResponse) {}
}

message RegisterRepairCandidateVersionRequest {
  string task_id = 1;
  string incident_id = 2;
  string project_id = 3;
  string installation_id = 4;
  // The Runtime job verdict facts Reliability observed before registering.
  string build_job_id = 5;
  string source_digest = 6;
}

message RegisterRepairCandidateVersionResponse {
  string version = 1;
  string manifest_digest = 2;
  bool created = 3;
  // Immutable version and revision from the persisted repair target, checked
  // before first registration and reused unchanged on every replay (ADR-0026).
  string base_version = 4;
  int64 project_revision = 5;
}

message PublishRepairCandidateVersionRequest {
  string task_id = 1;
  string project_id = 2;
  string installation_id = 3;
  string version = 4;
  string manifest_digest = 5;
}

message PublishRepairCandidateVersionResponse {
  bool published = 1;
}

message TransitionCandidateVersionRequest {
  string idempotency_key = 1;
  string project_id = 2;
  string installation_id = 3;
  string version = 4;
  string manifest_digest = 5;
  int64 expected_project_revision = 6;
}

message TransitionCandidateVersionResponse {
  string version = 1;
  int64 project_revision = 2;
}

// Core's private Reliability-facing listener only: staged candidate lifecycle.
// Owner identity comes from the trusted service context. Staged versions are
// invisible to default selection and owner-driven transitions (ADR-0026).
service RepairVersionService {
  rpc RegisterRepairCandidateVersion(RegisterRepairCandidateVersionRequest) returns (RegisterRepairCandidateVersionResponse) {}
  rpc PublishRepairCandidateVersion(PublishRepairCandidateVersionRequest) returns (PublishRepairCandidateVersionResponse) {}
  rpc TransitionCandidateVersion(TransitionCandidateVersionRequest) returns (TransitionCandidateVersionResponse) {}
}

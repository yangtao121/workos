// Local-only index administration contract for the indexer's Unix admin
// socket: never routed by the gateway or any TCP listener, only the local
// operator (workosctl) reaches it. Responses carry safe operational facts
// (generations, phases, bounded counts, watermarks, sanitized failure
// categories) — never queries, titles, excerpts, content, or tokens.
syntax = "proto3";

package workos.index.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/yangtao121/workos/gen/go/workos/index/v1;indexv1";

message IndexAdminGeneration {
  string generation_id = 1;
  // "project" or "all".
  string scope = 2;
  string owner_user_id = 3;
  string project_id = 4;
  // building | active | retired | failed | canceled. Unknown values fail
  // closed at the CLI.
  string status = 5;
  int64 document_count = 6;
  int64 tombstone_count = 7;
  // UTC RFC 3339 microseconds.
  string created_at = 8;
  string promoted_at = 9;
}

message IndexAdminRebuildJob {
  string job_id = 1;
  string scope = 2;
  string owner_user_id = 3;
  string project_id = 4;
  // requested | snapshotting | catching_up | validating | promoting |
  // completed | canceled | failed. Unknown values fail closed at the CLI.
  string state = 5;
  // Durable resume cursor for the current phase (safe operational fact).
  string phase_cursor = 6;
  string snapshot_boundary = 7;
  int64 source_count = 8;
  int64 applied_count = 9;
  int64 tombstone_count = 10;
  string failure_category = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  string target_generation_id = 14;
}

message GetIndexAdminStatusRequest {}

message GetIndexAdminStatusResponse {
  // The generation all searches currently read.
  IndexAdminGeneration active_generation = 1;
  bool catching_up = 2;
  int64 pending_publications = 3;
  // High-watermark of consumed publications (UTC RFC 3339 microseconds).
  string indexed_through = 4;
  string last_indexed_at = 5;
  // Present when a rebuild job is requested/running.
  IndexAdminRebuildJob active_rebuild = 6;
}

message StartIndexRebuildRequest {
  message AllScope {}
  message ProjectScope {
    string owner_user_id = 1;
    string project_id = 2;
  }
  oneof scope {
    // Explicit full rebuild of every active scope from Core authority.
    // Never an implicit wipe of the database.
    AllScope all = 1;
    ProjectScope project = 2;
  }
  // Durable idempotency key (1..128 runes). Same key + same canonical scope
  // replays the same job; same key + different scope conflicts; validation
  // and permission failures never consume the key.
  string idempotency_key = 3;
}

message StartIndexRebuildResponse {
  IndexAdminRebuildJob job = 1;
}

message GetIndexRebuildJobRequest {
  string job_id = 1;
}

message GetIndexRebuildJobResponse {
  IndexAdminRebuildJob job = 1;
}

message CancelIndexRebuildJobRequest {
  string job_id = 1;
}

message CancelIndexRebuildJobResponse {
  IndexAdminRebuildJob job = 1;
}

message IndexWorkspaceSource {
  string source_id = 1;
  string owner_user_id = 2;
  string project_id = 3;
  // Mount root as explicitly bound by the owner (safe operational fact).
  string root_path = 4;
  // active | degraded | stopped. Unknown values fail closed at the CLI.
  string status = 5;
  // Sanitized failure category; empty unless degraded.
  string degraded_reason = 6;
  int64 indexed_count = 7;
  int64 skipped_count = 8;
  int64 tombstoned_count = 9;
  // UTC RFC 3339 microseconds; empty before the first sync.
  string last_synced_at = 10;
  string created_at = 11;
  // Opaque source version; required when stopping this binding.
  string etag = 12;
}

message RegisterWorkspaceSourceRequest {
  string owner_user_id = 1;
  string project_id = 2;
  string root_path = 3;
}

message RegisterWorkspaceSourceResponse {
  IndexWorkspaceSource source = 1;
}

message ListWorkspaceSourcesRequest {}

message ListWorkspaceSourcesResponse {
  repeated IndexWorkspaceSource sources = 1;
}

message SyncWorkspaceSourceRequest {
  string source_id = 1;
}

message SyncWorkspaceSourceResponse {
  IndexWorkspaceSource source = 1;
  int64 applied_count = 2;
  int64 tombstoned_count = 3;
  int64 skipped_count = 4;
  // Sanitized skip categories observed this pass (bounded).
  repeated string skipped_reasons = 5;
}

// Local operator stop removes this binding's indexed workspace snapshots.
// A stale etag is Aborted and has no effect on a newer binding.
message StopWorkspaceSourceRequest {
  string source_id = 1;
  string expected_etag = 2;
}

message StopWorkspaceSourceResponse {
  IndexWorkspaceSource source = 1;
}

message PutArchiveObjectRequest {
  string owner_user_id = 1;
  // Bounded IANA media type; defaults to application/octet-stream.
  string media_type = 2;
  // 1..8 MiB. Larger payloads are rejected, never truncated.
  bytes content = 3;
}

message PutArchiveObjectResponse {
  string object_id = 1;
  string sha256 = 2;
  int64 byte_count = 3;
  // True when an existing object with the same owner+digest was returned.
  bool deduplicated = 4;
}

message GetArchiveObjectRequest {
  string owner_user_id = 1;
  string object_id = 2;
}

message ArchiveObjectMetadata {
  string object_id = 1;
  string sha256 = 2;
  string media_type = 3;
  int64 byte_count = 4;
  // UTC RFC 3339 microseconds.
  string created_at = 5;
}

message GetArchiveObjectResponse {
  ArchiveObjectMetadata object = 1;
  bytes content = 2;
}

message ListArchiveObjectsRequest {
  string owner_user_id = 1;
  // 1..200; defaults to 50.
  int32 limit = 2;
}

message ListArchiveObjectsResponse {
  repeated ArchiveObjectMetadata objects = 1;
}

service IndexAdminService {
  rpc GetIndexAdminStatus(GetIndexAdminStatusRequest) returns (GetIndexAdminStatusResponse) {}
  rpc StartIndexRebuild(StartIndexRebuildRequest) returns (StartIndexRebuildResponse) {}
  rpc GetIndexRebuildJob(GetIndexRebuildJobRequest) returns (GetIndexRebuildJobResponse) {}
  rpc CancelIndexRebuildJob(CancelIndexRebuildJobRequest) returns (CancelIndexRebuildJobResponse) {}
  rpc RegisterWorkspaceSource(RegisterWorkspaceSourceRequest) returns (RegisterWorkspaceSourceResponse) {}
  rpc ListWorkspaceSources(ListWorkspaceSourcesRequest) returns (ListWorkspaceSourcesResponse) {}
  rpc SyncWorkspaceSource(SyncWorkspaceSourceRequest) returns (SyncWorkspaceSourceResponse) {}
  rpc StopWorkspaceSource(StopWorkspaceSourceRequest) returns (StopWorkspaceSourceResponse) {}
  // Bounded generic archive (ADR-0017 §5): content-addressed object facts.
  // Objects never enter the search projection.
  rpc PutArchiveObject(PutArchiveObjectRequest) returns (PutArchiveObjectResponse) {}
  rpc GetArchiveObject(GetArchiveObjectRequest) returns (GetArchiveObjectResponse) {}
  rpc ListArchiveObjects(ListArchiveObjectsRequest) returns (ListArchiveObjectsResponse) {}
}

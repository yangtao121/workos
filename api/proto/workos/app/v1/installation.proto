syntax = "proto3";

package workos.app.v1;

import "google/protobuf/timestamp.proto";
import "workos/common/v1/common.proto";

option go_package = "github.com/yangtao121/workos/gen/go/workos/app/v1;appv1";

// AppInstallation is the durable instance identity of one registered app
// version installed in a project. The id is the stable app instance identity
// future surfaces reference as app_instance_id; an installation alone does
// NOT mean any workload is running. Permissions in the registry manifest
// remain requested permissions until a future grant flow exists.
message AppInstallation {
  string id = 1;
  string project_id = 2;
  string app_id = 3;
  // Immutable registry version pinned at install time; a newer registry
  // version never changes an existing installation.
  string version = 4;
  string manifest_digest = 5;
  google.protobuf.Timestamp installed_at = 6;
  optional google.protobuf.Timestamp uninstalled_at = 7;
  // The current canonical complete grant set: the user's last successful
  // confirmation, canonical sorted and duplicate-free, always a subset of the
  // pinned version's requested permissions. Historically an immutable
  // install-time snapshot; since ADR-0003 it can be explicitly replaced via
  // SetAppGrants. Empty (or omitted) means no capability was granted; it
  // never falls back to the requested permissions.
  repeated string granted_permissions = 8;
  // Authorization epoch of the grant set above: starts at 1 when the
  // installation is created and increases by exactly one only when the grant
  // set actually changes. Core increments it inside the SetAppGrants
  // transaction; clients can never submit or predict it.
  int64 grant_revision = 9;
}

// InstallAppRequest installs one owner-scoped app into the owner's active
// project. An empty version resolves the registry's current version inside
// this command and pins that exact immutable version and digest.
message InstallAppRequest {
  string idempotency_key = 1;
  string project_id = 2;
  string app_id = 3;
  string version = 4;
  int64 expected_project_revision = 5;
  // Explicit install-time grant snapshot submitted by the client. It must be
  // a subset of the pinned version's requested permissions; duplicates or
  // unknown capabilities are rejected. An omitted field still means an empty
  // grant: requesting a permission never grants it.
  repeated string granted_permissions = 6;
}

message InstallAppResponse {
  AppInstallation installation = 1;
  int64 project_revision = 2;
}

message UninstallAppRequest {
  string idempotency_key = 1;
  string project_id = 2;
  string installation_id = 3;
  int64 expected_project_revision = 4;
}

message UninstallAppResponse {
  AppInstallation installation = 1;
  int64 project_revision = 2;
}

// ListInstalledAppsRequest lists the active installations of one project,
// ordered by app ID. Tombstoned installations are not listed.
message ListInstalledAppsRequest {
  string project_id = 1;
  workos.common.v1.PageRequest page = 2;
}

message ListInstalledAppsResponse {
  repeated AppInstallation installations = 1;
  workos.common.v1.PageResponse page = 2;
}

// SetAppGrantsRequest replaces one installation's entire grant set. The
// request is a full replacement, not an incremental add/remove patch: the
// granted_permissions field carries the complete final set the user wants.
message SetAppGrantsRequest {
  string idempotency_key = 1;
  string project_id = 2;
  string installation_id = 3;
  int64 expected_project_revision = 4;
  // Complete replacement target set (canonical sorted, duplicate-free subset
  // of the pinned version's requested permissions). Empty (or omitted) means
  // revoke all; it never falls back to requested permissions.
  repeated string granted_permissions = 5;
}

message SetAppGrantsResponse {
  AppInstallation installation = 1;
  int64 project_revision = 2;
}

service AppInstallationService {
  rpc InstallApp(InstallAppRequest) returns (InstallAppResponse) {}
  rpc UninstallApp(UninstallAppRequest) returns (UninstallAppResponse) {}
  rpc ListInstalledApps(ListInstalledAppsRequest) returns (ListInstalledAppsResponse) {}
  // SetAppGrants replaces the installation's whole grant set in one command.
  // A target set equal to the current grant is a deterministic no-op: the
  // idempotency key is still durably consumed and replays exactly, but the
  // project revision, grant revision, events, and timestamps do not change.
  // A real change bumps both revisions by exactly one and commits the
  // installation update, project event, outbox, and idempotency result in a
  // single transaction. The command is serialized against every other
  // project mutation by expected_project_revision.
  rpc SetAppGrants(SetAppGrantsRequest) returns (SetAppGrantsResponse) {}
}

syntax = "proto3";

package workos.credential.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/yangtao121/workos/gen/go/workos/credential/v1;credentialv1";

// CredentialMetadata is the only credential projection any surface outside
// the Credential Vault ever sees. It carries zero secret material: no
// plaintext, ciphertext, nonce, key identifier, or fingerprint. `id` is the
// server-minted UUIDv7 and the sole opaque reference Project bindings and
// task snapshots persist. `consumer_id` is the canonical provider ID the
// credential is bound to (currently); `purpose` is a canonical bounded type,
// first version `provider-api-key.v1`. Revision starts at 1 and increases
// strictly with every mutation.
message CredentialMetadata {
  string id = 1;
  string owner_user_id = 2;
  string consumer_id = 3;
  string purpose = 4;
  string label = 5;
  int64 revision = 6;
  CredentialStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

enum CredentialStatus {
  CREDENTIAL_STATUS_UNSPECIFIED = 0;
  CREDENTIAL_STATUS_ACTIVE = 1;
  CREDENTIAL_STATUS_REVOKED = 2;
}

// PutCredential stores one new long-lived provider credential. The secret
// exists only inside this bounded request on the Core admin Unix socket;
// responses are metadata-only. Every external write carries an idempotency
// key. The owner is derived by Core from its single-owner configuration —
// the admin protocol never accepts one.
message PutCredentialRequest {
  string consumer_id = 1;
  string purpose = 2;
  string label = 3;
  bytes secret = 4;
  string idempotency_key = 5;
}

message PutCredentialResponse {
  CredentialMetadata credential = 1;
}

// RotateCredential replaces the secret material of an existing logical
// credential: the ID stays, revision increases by exactly one. The expected
// revision makes concurrent rotations single-winner.
message RotateCredentialRequest {
  string credential_id = 1;
  bytes secret = 2;
  string label = 3;
  int64 expected_revision = 4;
  string idempotency_key = 5;
}

message RotateCredentialResponse {
  CredentialMetadata credential = 1;
}

// RevokeCredential is irreversible: status becomes revoked and revision
// increases by exactly one. Existing task snapshots keep pointing at the
// revoked revision and fail closed; new bindings and acquires are refused.
message RevokeCredentialRequest {
  string credential_id = 1;
  int64 expected_revision = 2;
  string idempotency_key = 3;
}

message RevokeCredentialResponse {
  CredentialMetadata credential = 1;
}

message ListCredentialsRequest {}

message ListCredentialsResponse {
  repeated CredentialMetadata credentials = 1;
}

// AcquireTaskCredential derives everything from the caller-supplied task
// lease ID and worker ID alone. Clients can never select owner, project,
// provider, credential reference, or revision: Core resolves the exact
// credential snapshot from the active task lease inside one controlled
// transaction. Decrypted secret material appears only in Acquire responses;
// response-loss replay may re-deliver it to the same worker while the same
// task lease remains active. Renewals never return it.
message AcquireTaskCredentialRequest {
  string task_lease_id = 1;
  string worker_id = 2;
}

message AcquireTaskCredentialResponse {
  string credential_lease_id = 1;
  string task_lease_id = 2;
  string consumer_id = 3;
  string purpose = 4;
  int64 credential_revision = 5;
  google.protobuf.Timestamp expires_at = 6;
  bytes secret = 7;
  // required is false only when the task snapshot proves the resolved
  // provider needs no credential at all; it is never a success verdict for
  // a credential-bearing task whose snapshot could not be satisfied.
  bool required = 8;
}

// RenewTaskCredentialLease extends a short credential lease to the current
// expiry of the underlying active task lease. It accepts only the three
// lease/worker identifiers and never returns secret material. A revoked or
// rotated credential snapshot, a lost task lease, or an expired lease
// answers valid=false so the worker stops its provider child on the next
// bounded heartbeat.
message RenewTaskCredentialLeaseRequest {
  string credential_lease_id = 1;
  string task_lease_id = 2;
  string worker_id = 3;
}

message RenewTaskCredentialLeaseResponse {
  bool valid = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// ReleaseTaskCredentialLease is idempotent: releasing an already released or
// expired lease succeeds. A released lease can never be acquired or renewed
// again under the same task lease.
message ReleaseTaskCredentialLeaseRequest {
  string credential_lease_id = 1;
  string task_lease_id = 2;
  string worker_id = 3;
}

message ReleaseTaskCredentialLeaseResponse {}

// CredentialAdminService is served ONLY on the Core-owned credential admin
// Unix socket (mode 0600, single-owner deployment). It is never registered
// on the ordinary Core HTTP listener, never proxied by the Gateway, and
// never reachable from harness-host. The socket has its own pre-decode body
// budget; secrets never transit TCP or the Gateway.
service CredentialAdminService {
  rpc PutCredential(PutCredentialRequest) returns (PutCredentialResponse) {}
  rpc RotateCredential(RotateCredentialRequest) returns (RotateCredentialResponse) {}
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse) {}
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse) {}
}

// CredentialLeaseService is served ONLY on the Core private mutually
// authenticated TLS harness execution listener. harness-host reaches it with
// its exact leaf identity after claiming a task; the Gateway and every
// public surface deterministically cannot route here.
service CredentialLeaseService {
  rpc AcquireTaskCredential(AcquireTaskCredentialRequest) returns (AcquireTaskCredentialResponse) {}
  rpc RenewTaskCredentialLease(RenewTaskCredentialLeaseRequest) returns (RenewTaskCredentialLeaseResponse) {}
  rpc ReleaseTaskCredentialLease(ReleaseTaskCredentialLeaseRequest) returns (ReleaseTaskCredentialLeaseResponse) {}
}

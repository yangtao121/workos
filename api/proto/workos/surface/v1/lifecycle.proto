syntax = "proto3";

package workos.surface.v1;

option go_package = "github.com/yangtao121/workos/gen/go/workos/surface/v1;surfacev1";

// Program lifetime is independent of device, input and media authorization.
enum LifecycleMode {
  // Legacy callers retain the bounded 30-minute policy.
  LIFECYCLE_MODE_UNSPECIFIED = 0;
  LIFECYCLE_MODE_BOUNDED = 1;
  // No automatic time expiry; stop/revocation/failure still reclaim it.
  LIFECYCLE_MODE_MANUAL_STOP = 2;
}

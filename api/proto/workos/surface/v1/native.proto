syntax = "proto3";

package workos.surface.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/yangtao121/workos/gen/go/workos/surface/v1;surfacev1";

// One supervised virtual-display native session (ADR-0029): a real Xvfb
// display, a configured native X client, and an ffmpeg x11grab/VP8 capture
// streamed to the desktop over loopback WebRTC. Input returns over a data
// channel. Gateway routes the service with owner identity.
message NativeSession {
  string id = 1;
  string owner_user_id = 2;
  string project_id = 3;
  // queued|running|closed|failed
  string state = 4;
  // Honest engine facts: the virtual display engine id.
  string engine = 5;
  int32 width = 6;
  int32 height = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp expires_at = 9;
}

message CreateNativeSessionRequest {
  string idempotency_key = 1;
  string project_id = 2;
  // Fixed initial display size; later changes are not negotiated.
  int32 width = 3;
  int32 height = 4;
}

message CreateNativeSessionResponse {
  NativeSession session = 1;
}

// Signaling segment, separate from session identity so a browser reload can
// re-offer without breaking the creation idempotency key. Offers and answers
// carry complete ICE candidates (no trickle). Each peer expires after 30 seconds;
// continuing media/input requires another authenticated Connect through Gateway.
message ConnectNativeSessionRequest {
  string session_id = 1;
  string offer_sdp = 2;
  int64 control_generation = 3;
}

message ConnectNativeSessionResponse {
  NativeSession session = 1;
  string answer_sdp = 2;
}

message CloseNativeSessionRequest {
  string session_id = 1;
}

message CloseNativeSessionResponse {
  NativeSession session = 1;
}

message GetNativeSessionRequest {
  string session_id = 1;
}

message GetNativeSessionResponse {
  NativeSession session = 1;
}

message DetachNativeSessionRequest {
  string session_id = 1;
}

message DetachNativeSessionResponse {}

// Ephemeral transport capability, never a provider or TURN shared secret.
// Values must not be persisted, logged, or exposed to embedded Apps.
message NativeIceServer {
  repeated string urls = 1;
  string username = 2;
  string credential = 3;
}

message GetNativeConnectivityRequest {
  string session_id = 1;
  int64 control_generation = 2;
}

message GetNativeConnectivityResponse {
  // Operator-selected loopback|lan|relay. Clients cannot widen this policy.
  string mode = 1;
  repeated NativeIceServer ice_servers = 2;
  bool relay_only = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// Canonical workos.input data-channel payload, serialized as protobuf JSON.
// The adapter rejects unknown fields/types, invalid combinations and oversized
// events. Only the bounded text/key/pointer vocabulary below is supported.
message NativeInputEvent {
  // text|key|pointer
  string type = 1;
  // text events: at most 256 printable Unicode runes (newline/tab allowed).
  string text = 2;
  // key events: the versioned finite key allowlist in ADR-0029.
  string key = 3;
  // pointer events: move|down|up|click; coordinates must be finite in [0,1].
  string action = 4;
  double x = 5;
  double y = 6;
  // X button mapping: 1=left, 2=middle, 3=right; required for down/up/click.
  int32 button = 7;
}

// Supervised owner-scoped virtual-display sessions on the runtime host
// (ADR-0029). Gateway routes it with owner identity; the display children run
// as the runtime's own user with process-group supervision, and nothing here
// grants filesystem or host-input escapes.
service NativeSessionService {
  // Requires the active session owner and current device control generation.
  // Fetch before each offer; it does not grant control or extend media leases.
  rpc GetNativeConnectivity(GetNativeConnectivityRequest) returns (GetNativeConnectivityResponse) {}
  rpc CreateNativeSession(CreateNativeSessionRequest) returns (CreateNativeSessionResponse) {}
  rpc ConnectNativeSession(ConnectNativeSessionRequest) returns (ConnectNativeSessionResponse) {}
  rpc GetNativeSession(GetNativeSessionRequest) returns (GetNativeSessionResponse) {}
  // Close keeps its historical meaning: stop the display, the X client, and
  // the capture children, then reclaim everything.
  rpc CloseNativeSession(CloseNativeSessionRequest) returns (CloseNativeSessionResponse) {}
  // Detach releases only this device's media peer, input subscription, and
  // short-lived authorization. The supervised display session keeps running
  // under its bounded policy until Close or expiry (ADR-0031).
  rpc DetachNativeSession(DetachNativeSessionRequest) returns (DetachNativeSessionResponse) {}
}

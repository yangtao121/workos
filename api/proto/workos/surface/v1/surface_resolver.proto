// Private Core-owned installed-instance resolution for web bundle surfaces.
// Not on the gateway allowlist; only runtime-host reaches it with trusted
// identity, and every call re-resolves from authoritative Core facts.
syntax = "proto3";

package workos.surface.v1;

option go_package = "github.com/yangtao121/workos/gen/go/workos/surface/v1;surfacev1";

// WebBundleLaunchDescriptor is the neutral, immutable launch fact for one
// installed instance: the pinned registry identity plus the exact bundle
// artifact it references.
message WebBundleLaunchDescriptor {
  string app_id = 1;
  string version = 2;
  string manifest_digest = 3;
  string artifact_id = 4;
  string artifact_digest = 5;
  string entrypoint = 6;
}

message ResolveWebBundleRequest {
  string project_id = 1;
  string app_instance_id = 2;
}

message ResolveWebBundleResponse {
  WebBundleLaunchDescriptor launch = 1;
  // The active installation's grant set, re-read from authoritative Core
  // facts on every resolution so the runtime can compute effective bridge
  // capabilities without trusting stale state.
  repeated string granted_permissions = 2;
  // The authoritative installation grant epoch, read from the same Core
  // facts as granted_permissions in the same resolution. The runtime must
  // persist it into the surface session and derive every private
  // authorization comparison from that snapshot; public inputs can never
  // supply or override it.
  int64 grant_revision = 3;
}

message ReadWebBundleAssetRequest {
  string project_id = 1;
  string app_instance_id = 2;
  // asset_path is the normalized relative bundle path (empty means the
  // entrypoint); the server rejects anything outside the pinned bundle.
  string asset_path = 3;
}

message ReadWebBundleAssetResponse {
  bytes content = 1;
  string media_type = 2;
  string etag = 3;
}

// ContainerResourcePolicy is the App's REQUESTED resource policy, projected
// verbatim from the canonical manifest. It is not an authorization: the
// runtime adjudicates it against server-owned maxima and persists the
// effective policy; these values never size the container directly.
message ContainerResourcePolicy {
  double cpu_hard_cores = 1;
  int32 memory_high_mb = 2;
  int32 memory_max_mb = 3;
  int32 pids_max = 4;
}

// ContainerHealthPolicy is the App's REQUESTED health policy, projected
// verbatim from the canonical manifest.
message ContainerHealthPolicy {
  string http_path = 1;
  int32 startup_seconds = 2;
  int32 restart_limit = 3;
}

// ContainerLaunchDescriptor is the neutral, immutable launch fact for one
// installed container instance: the pinned registry identity, the exact
// digest-pinned OCI image reference, the bounded argv, the container port,
// and the requested (never effective) resource/health policy. It never
// carries engine flags, host endpoints, container IDs, credentials, or
// effective policy.
message ContainerLaunchDescriptor {
  string app_id = 1;
  string version = 2;
  string manifest_digest = 3;
  string image = 4;
  repeated string command = 5;
  int32 port = 6;
  ContainerResourcePolicy resources = 7;
  ContainerHealthPolicy health = 8;
  string surface_route = 9;
}

message ResolveSurfaceLaunchRequest {
  string project_id = 1;
  string app_instance_id = 2;
}

message ResolveSurfaceLaunchResponse {
  oneof launch {
    WebBundleLaunchDescriptor web_bundle = 1;
    ContainerLaunchDescriptor web_service_container = 2;
  }
  // The active installation's grant set and epoch, re-read from the same
  // authoritative Core facts as the launch descriptor (same semantics as
  // ResolveWebBundleResponse fields 2 and 3).
  repeated string granted_permissions = 3;
  int64 grant_revision = 4;
}

service SurfaceLaunchResolverService {
  rpc ResolveWebBundle(ResolveWebBundleRequest) returns (ResolveWebBundleResponse) {}
  rpc ReadWebBundleAsset(ReadWebBundleAssetRequest) returns (ReadWebBundleAssetResponse) {}
  // ResolveSurfaceLaunch is the generic renderer-neutral resolution: it
  // returns the exact installed descriptor under a oneof so the runtime can
  // select the supported renderer. Unknown/foreign/archived/uninstalled
  // installations are NotFound; a stored canonical manifest that violates its
  // own profile is sanitized Internal; a healthy but unsupported runtime is
  // FailedPrecondition.
  rpc ResolveSurfaceLaunch(ResolveSurfaceLaunchRequest) returns (ResolveSurfaceLaunchResponse) {}
}

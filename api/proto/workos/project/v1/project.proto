syntax = "proto3";

package workos.project.v1;

import "google/protobuf/timestamp.proto";
import "workos/common/v1/common.proto";

option go_package = "github.com/yangtao121/workos/gen/go/workos/project/v1;projectv1";

enum WorkspaceKind {
  WORKSPACE_KIND_UNSPECIFIED = 0;
  WORKSPACE_KIND_LOCAL_GIT = 1;
  WORKSPACE_KIND_LOCAL_DIRECTORY = 2;
  WORKSPACE_KIND_NAS = 3;
  WORKSPACE_KIND_REMOTE_DIRECTORY = 4;
  WORKSPACE_KIND_DATASET = 5;
  WORKSPACE_KIND_ARTIFACTS = 6;
}

message WorkspaceRef {
  string id = 1;
  WorkspaceKind kind = 2;
  string uri = 3;
  string logical_mount = 4;
  bool read_only = 5;
}

enum HarnessInstancePolicy {
  HARNESS_INSTANCE_POLICY_UNSPECIFIED = 0;
  HARNESS_INSTANCE_POLICY_PERSISTENT = 1;
  HARNESS_INSTANCE_POLICY_LAZY = 2;
  HARNESS_INSTANCE_POLICY_EPHEMERAL = 3;
}

message HarnessBinding {
  string provider_id = 1;
  HarnessInstancePolicy instance_policy = 2;
  string profile_id = 3;
  string credential_ref = 4;
  string resource_policy_id = 5;
}

message Project {
  string id = 1;
  string owner_user_id = 2;
  string name = 3;
  string icon = 4;
  repeated WorkspaceRef workspace_refs = 5;
  optional HarnessBinding harness_binding = 6;
  repeated string installed_app_ids = 7;
  string default_agent_role = 8;
  string knowledge_collection_id = 9;
  string artifact_collection_id = 10;
  int64 revision = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  optional google.protobuf.Timestamp archived_at = 14;
}

message CreateProjectRequest {
  string idempotency_key = 1;
  string name = 2;
  string icon = 3;
  repeated WorkspaceRef workspace_refs = 4;
  optional HarnessBinding harness_binding = 5;
}

message GetProjectRequest {
  string project_id = 1;
}

message ListProjectsRequest {
  workos.common.v1.PageRequest page = 1;
  bool include_archived = 2;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  workos.common.v1.PageResponse page = 2;
}

message UpdateProjectRequest {
  string project_id = 1;
  int64 expected_revision = 2;
  optional string name = 3;
  optional string icon = 4;
  repeated WorkspaceRef workspace_refs = 5;
  bool replace_workspace_refs = 6;
  optional HarnessBinding harness_binding = 7;
  bool clear_harness_binding = 8;
}

message ArchiveProjectRequest {
  string project_id = 1;
  int64 expected_revision = 2;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message UpdateProjectResponse {
  Project project = 1;
}

message ArchiveProjectResponse {
  Project project = 1;
}

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {}
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {}
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {}
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse) {}
  rpc ArchiveProject(ArchiveProjectRequest) returns (ArchiveProjectResponse) {}
}

syntax = "proto3";

package workos.project.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/yangtao121/workos/gen/go/workos/project/v1;projectv1";

// A project workspace binding (ADR-0030): Core owns the ownership and
// authorization facts; the runtime owns the actual directory assembly and
// execution facts. Clients reference operator-registered workspace sources
// by id and never submit host paths.

enum WorkspaceBindingState {
  WORKSPACE_BINDING_STATE_UNSPECIFIED = 0;
  WORKSPACE_BINDING_STATE_ACTIVE = 1;
  WORKSPACE_BINDING_STATE_ARCHIVED = 2;
}

message WorkspaceBinding {
  string id = 1;
  string owner_user_id = 2;
  string project_id = 3;
  // Opaque reference to an operator-registered workspace source on the
  // runtime host. Never a host path.
  string workspace_source_id = 4;
  string display_name = 5;
  bool read_only = 6;
  WorkspaceBindingState state = 7;
  // Monotonic revision; executions pin one revision and stale revisions
  // refuse new authorizations.
  int64 revision = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  optional google.protobuf.Timestamp archived_at = 11;
}

message BindWorkspaceRequest {
  string project_id = 1;
  string workspace_source_id = 2;
  string display_name = 3;
  string idempotency_key = 4;
}

message BindWorkspaceResponse {
  WorkspaceBinding binding = 1;
}

message GetWorkspaceRequest {
  string binding_id = 1;
}

message GetWorkspaceResponse {
  WorkspaceBinding binding = 1;
}

message ListProjectWorkspacesRequest {
  string project_id = 1;
  bool include_archived = 2;
}

message ListProjectWorkspacesResponse {
  repeated WorkspaceBinding bindings = 1;
}

message UpdateWorkspaceAccessRequest {
  string binding_id = 1;
  int64 expected_revision = 2;
  optional bool read_only = 3;
}

message UpdateWorkspaceAccessResponse {
  WorkspaceBinding binding = 1;
}

message ArchiveWorkspaceRequest {
  string binding_id = 1;
  int64 expected_revision = 2;
}

message ArchiveWorkspaceResponse {
  WorkspaceBinding binding = 1;
}

message AvailableWorkspaceSource {
  string id = 1;
  string display_name = 2;
  string kind = 3;
  bool read_only = 4;
}
message ListAvailableWorkspacesRequest {
  string project_id = 1;
}
message ListAvailableWorkspacesResponse {
  repeated AvailableWorkspaceSource sources = 1;
}
message WorkspaceFileEntry {
  string path = 1;
  string kind = 2;
  int64 size = 3;
}
message ListWorkspaceFilesRequest {
  string project_id = 1;
  string path = 2;
}
message ListWorkspaceFilesResponse {
  repeated WorkspaceFileEntry entries = 1;
  int64 workspace_revision = 2;
  bool read_only = 3;
}
message ReadWorkspaceFileRequest {
  string project_id = 1;
  string path = 2;
}
message ReadWorkspaceFileResponse {
  string content = 1;
  string etag = 2;
  int64 workspace_revision = 3;
  bool read_only = 4;
}
message WriteWorkspaceFileRequest {
  string project_id = 1;
  string path = 2;
  string content = 3;
  string expected_etag = 4;
  int64 workspace_revision = 5;
}
message WriteWorkspaceFileResponse {
  string etag = 1;
}
service ProjectWorkspaceService {
  rpc ListWorkspaceFiles(ListWorkspaceFilesRequest) returns (ListWorkspaceFilesResponse) {}
  rpc ReadWorkspaceFile(ReadWorkspaceFileRequest) returns (ReadWorkspaceFileResponse) {}
  rpc WriteWorkspaceFile(WriteWorkspaceFileRequest) returns (WriteWorkspaceFileResponse) {}

  rpc ListAvailableWorkspaces(ListAvailableWorkspacesRequest) returns (ListAvailableWorkspacesResponse) {}

  // BindWorkspace creates the single-owner association between a project and
  // an operator-registered workspace source. The source must be currently
  // reported by the runtime host; a client-supplied source id that the
  // operator never registered is NotFound.
  rpc BindWorkspace(BindWorkspaceRequest) returns (BindWorkspaceResponse) {}
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse) {}
  rpc ListProjectWorkspaces(ListProjectWorkspacesRequest) returns (ListProjectWorkspacesResponse) {}
  // UpdateWorkspaceAccess flips the read/write mode under optimistic
  // revision control. A read-only binding must fail every workspace write.
  rpc UpdateWorkspaceAccess(UpdateWorkspaceAccessRequest) returns (UpdateWorkspaceAccessResponse) {}
  // ArchiveWorkspace revokes the binding; Runtime rechecks active executions.
  rpc ArchiveWorkspace(ArchiveWorkspaceRequest) returns (ArchiveWorkspaceResponse) {}
}

// Private Runtime-to-Core authorization; never routed by Gateway. The caller
// is Runtime, which derives owner/project from authenticated session facts.
message ResolveWorkspaceExecutionRequest {
  string owner_user_id = 1;
  string project_id = 2;
}
message ResolveWorkspaceExecutionResponse {
  WorkspaceBinding binding = 1;
}
service WorkspaceExecutionAuthorizationService {
  rpc ResolveWorkspaceExecution(ResolveWorkspaceExecutionRequest) returns (ResolveWorkspaceExecutionResponse) {}
}

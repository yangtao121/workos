syntax = "proto3";

package workos.project.v1;

import "workos/project/v1/project.proto";

option go_package = "github.com/yangtao121/workos/gen/go/workos/project/v1;projectv1";

message SetProjectHarnessBindingRequest {
  string project_id = 1;
  int64 expected_revision = 2;

  oneof selection {
    string provider_id = 3;
    bool use_global_default = 4;
  }
}

message SetProjectHarnessBindingResponse {
  Project project = 1;
}

// ProjectHarnessBindingService selects a provider without exposing internal
// binding policy or credential references to clients.
service ProjectHarnessBindingService {
  rpc SetProjectHarnessBinding(SetProjectHarnessBindingRequest) returns (SetProjectHarnessBindingResponse) {}
}

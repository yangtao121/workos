syntax = "proto3";

package workos.artifact.v1;

import "google/protobuf/timestamp.proto";
import "workos/common/v1/common.proto";

option go_package = "github.com/yangtao121/workos/gen/go/workos/artifact/v1;artifactv1";

message Artifact {
  string id = 1;
  string project_id = 2;
  string type = 3;
  string title = 4;
  string media_type = 5;
  string content_ref = 6;
  string digest = 7;
  google.protobuf.Timestamp created_at = 8;
  int64 total_size_bytes = 9;
  int32 file_count = 10;
  // Review subtype provenance only: the Core-derived source task of a
  // project review artifact (document.markdown.v1 / code.unified-diff.v1).
  // Web bundle artifacts leave it and project_id empty. It is provenance
  // metadata, never an authorization token: every read stays owner/project
  // scoped and the source task UUID alone grants nothing.
  string source_task_id = 11;
}

// WebBundleFile is one regular file of a web bundle upload. The path is an
// untrusted relative POSIX path; the server validates, normalizes, and derives
// the stored media type. File order in the request never affects the canonical
// bundle digest.
message WebBundleFile {
  string path = 1;
  bytes content = 2;
}

// WebBundleContent is the explicit web bundle upload payload. Archives
// (ZIP/TAR) are deliberately out of scope: the file list keeps the upload
// surface bounded and auditable.
message WebBundleContent {
  string entrypoint = 1;
  repeated WebBundleFile files = 2;
}

message CreateArtifactRequest {
  string idempotency_key = 1;
  Artifact artifact = 2;
  // web_bundle is the only supported artifact payload in this slice. When it
  // is set, the artifact metadata may carry only the title; server-owned
  // fields (id, project_id, type, media_type, content_ref, digest,
  // created_at) must be empty and are rejected otherwise.
  WebBundleContent web_bundle = 3;
}

message GetArtifactRequest {
  string artifact_id = 1;
}

message ListArtifactsRequest {
  string project_id = 1;
  workos.common.v1.PageRequest page = 2;
}

message ListArtifactsResponse {
  repeated Artifact artifacts = 1;
  workos.common.v1.PageResponse page = 2;
}

message CreateArtifactResponse {
  Artifact artifact = 1;
}

message GetArtifactResponse {
  Artifact artifact = 1;
}

// ReviewArtifactContent carries one review subtype's exact canonical content.
// The media type is server-derived from the stored canonical type; a client
// can never choose or override it.
message ReviewArtifactContent {
  // MarkdownReviewContent is the exact canonical UTF-8 content of a
  // document.markdown.v1 artifact.
  message Markdown {
    string media_type = 1;
    bytes content = 2;
  }

  // UnifiedDiff is the exact canonical UTF-8 content of a
  // code.unified-diff.v1 artifact.
  message UnifiedDiff {
    string media_type = 1;
    bytes content = 2;
  }

  oneof content {
    Markdown markdown = 1;
    UnifiedDiff unified_diff = 2;
  }
}

message GetReviewArtifactRequest {
  string artifact_id = 1;
}

message GetReviewArtifactResponse {
  // artifact is the authoritative sanitized metadata projection.
  Artifact artifact = 1;
  // content is present only for review subtypes; web bundle artifacts are
  // never reviewable and fail closed without disclosing bundle bytes.
  ReviewArtifactContent content = 2;
}

service ArtifactService {
  rpc CreateArtifact(CreateArtifactRequest) returns (CreateArtifactResponse) {}
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse) {}
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse) {}
  // GetReviewArtifact returns one review artifact's authoritative metadata
  // and exact canonical content for the authenticated owner. It never serves
  // web bundle bytes and never accepts client-chosen media types.
  rpc GetReviewArtifact(GetReviewArtifactRequest) returns (GetReviewArtifactResponse) {}
}

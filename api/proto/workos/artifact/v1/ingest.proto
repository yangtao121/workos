syntax = "proto3";

package workos.artifact.v1;

import "workos/artifact/v1/artifact.proto";

option go_package = "github.com/yangtao121/workos/gen/go/workos/artifact/v1;artifactv1";

// Private Runtime-derived scope. Core locks and revalidates current grants.
message AppArtifactScope {
  string project_id = 1;
  string app_instance_id = 2;
  int64 installation_grant_revision = 3;
}
message CreateAppReviewArtifactRequest {
  AppArtifactScope scope = 1;
  string idempotency_key = 2;
  string type = 3;
  string title = 4;
  bytes content = 5;
}
message CreateAppReviewArtifactResponse {
  Artifact artifact = 1;
}
message OpenAppReviewArtifactRequest {
  AppArtifactScope scope = 1;
  string artifact_id = 2;
}
message OpenAppReviewArtifactResponse {
  Artifact artifact = 1;
}

// Private Core service; never routed by Gateway.
service AppArtifactService {
  rpc CreateAppReviewArtifact(CreateAppReviewArtifactRequest) returns (CreateAppReviewArtifactResponse) {}
  rpc OpenAppReviewArtifact(OpenAppReviewArtifactRequest) returns (OpenAppReviewArtifactResponse) {}
}

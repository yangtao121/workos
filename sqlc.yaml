version: "2"
sql:
  - engine: postgresql
    schema: internal/platform/migrations/files
    queries: internal/core/project/adapters/postgres/queries.sql
    gen:
      go:
        package: projectdb
        out: internal/core/project/adapters/postgres/projectdb
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage

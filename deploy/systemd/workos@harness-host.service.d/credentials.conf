[Service]
# Harness-only material. The client leaf key is available to this unit only;
# the Core server key and vault master key are never loaded here.
User=workos-harness
Group=workos-harness
LoadCredential=execution-ca.crt:/etc/workos/credentials/execution-ca.crt
LoadCredential=execution-harness.crt:/etc/workos/credentials/execution-harness.crt
LoadCredential=execution-harness.key:/etc/workos/credentials/execution-harness.key
Environment=WORKOS_HARNESS_EXECUTION_CA_FILE=%d/execution-ca.crt
Environment=WORKOS_HARNESS_EXECUTION_CERT_FILE=%d/execution-harness.crt
Environment=WORKOS_HARNESS_EXECUTION_KEY_FILE=%d/execution-harness.key

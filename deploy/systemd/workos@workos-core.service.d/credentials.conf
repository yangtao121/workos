[Service]
# Core-only material. systemd copies each source into this unit's private,
# read-only credential directory. The distinct service account also makes
# the mode-0600 admin socket unreachable to harness-host and sibling units.
User=workos-core
Group=workos-core
RuntimeDirectory=workos-core
RuntimeDirectoryMode=0700
LoadCredential=execution-ca.crt:/etc/workos/credentials/execution-ca.crt
LoadCredential=execution-core.crt:/etc/workos/credentials/execution-core.crt
LoadCredential=execution-core.key:/etc/workos/credentials/execution-core.key
LoadCredential=vault-master.key:/etc/workos/credentials/vault-master.key
Environment=WORKOS_CORE_EXECUTION_CA_FILE=%d/execution-ca.crt
Environment=WORKOS_CORE_EXECUTION_CERT_FILE=%d/execution-core.crt
Environment=WORKOS_CORE_EXECUTION_KEY_FILE=%d/execution-core.key
Environment=WORKOS_CREDENTIAL_MASTER_KEY_FILE=%d/vault-master.key
Environment=WORKOS_CREDENTIAL_ADMIN_SOCKET=/run/workos-core/credential-admin.sock

# Development-only overlay: expose the dev-bypass gateway to the LAN over
# plain HTTP with no authentication (make dev-lan). Anyone on the LAN then
# holds the fixed owner identity and all traffic is cleartext — use only on a
# trusted development network. Production exposure stays on the TLS + device
# pairing path (lan-pairing profile / systemd :443).
#
# Usage:
#   docker compose -f compose.yaml -f deploy/compose.dev-lan.yaml up -d --build
#   # or: make dev-lan
services:
  workos-gateway:
    environment:
      WORKOS_HTTP_ADDRESS: 0.0.0.0:8080
      WORKOS_DEV_AUTH_BYPASS_ALLOW_LAN: "true"

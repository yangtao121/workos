# ADR-0040: only trusted Runtime receives the Docker Engine socket. It creates
# one no-network, no-port child per native workload; the child image never
# receives this socket or Runtime's database/service environment.
services:
  runtime-host:
    image: workos:dev
    user: "10001:10001"
    group_add: ["${WORKOS_DOCKER_GID:?}"]
    environment:
      WORKOS_RUNTIME_NATIVE_ENGINE: greenfield
      WORKOS_RUNTIME_NATIVE_GREENFIELD_CHILD_IMAGE: workos-greenfield-child:dev
      WORKOS_RUNTIME_NATIVE_GREENFIELD_IPC_ROOT: ${WORKOS_GREENFIELD_IPC_ROOT:?}
      WORKOS_RUNTIME_NATIVE_RENDER_DEVICE: /dev/dri/renderD128
      WORKOS_RUNTIME_NATIVE_RENDER_GID: ${WORKOS_GREENFIELD_RENDER_GID:?}
      WORKOS_RUNTIME_NATIVE_GPU_DRIVER: nvidia
      WORKOS_RUNTIME_DOCKER_SOCKET: /var/run/docker.sock
      WORKOS_RUNTIME_PTY_SHELL: /bin/bash
      WORKOS_WORKSPACE_DOCKER_SOCKET: /var/run/docker.sock
      WORKOS_WORKSPACE_EXECUTION_IMAGE: workos-workspace-runtime:dev
      WORKOS_RUNTIME_WORKSPACE_MOUNTS: ${WORKOS_RUNTIME_WORKSPACE_MOUNTS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKOS_GREENFIELD_IPC_ROOT:?}:${WORKOS_GREENFIELD_IPC_ROOT:?}
      - ${WORKOS_WORKSPACE_ROOTS:?}:${WORKOS_WORKSPACE_ROOTS:?}

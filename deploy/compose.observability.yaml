services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    network_mode: host
    # The telemetry feed volume is root-owned; the collector writes as root
    # and the file mode stays world-readable so the reliability-host reader
    # (uid 10001) can consume it read-only.
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - workos-telemetry:/var/lib/workos-telemetry
    restart: unless-stopped


  workos-gateway:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    depends_on:
      otel-collector:
        condition: service_started

  workos-core:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    depends_on:
      otel-collector:
        condition: service_started

  harness-host:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    depends_on:
      otel-collector:
        condition: service_started

  runtime-host:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    depends_on:
      otel-collector:
        condition: service_started

  reliability-host:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      WORKOS_TELEMETRY_FILE: /var/lib/workos-telemetry/telemetry.jsonl
    volumes:
      - workos-telemetry:/var/lib/workos-telemetry:ro
    depends_on:
      otel-collector:
        condition: service_started

  indexer:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    depends_on:
      otel-collector:
        condition: service_started

volumes:
  workos-telemetry:
